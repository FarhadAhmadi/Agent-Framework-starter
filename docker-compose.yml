services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: agent-framework-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your environment or .env file}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -b -l 5 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  papercut:
    image: jijiechen/papercut:latest
    container_name: agent-framework-papercut
    ports:
      - "25:25"
      - "37408:37408"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: agent-framework-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AppDb: "Server=sqlserver,1433;Database=MinimalCleanArchitecture;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      Mailserver__Server: papercut
      Mailserver__Port: 25
    depends_on:
      sqlserver:
        condition: service_healthy
      papercut:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
